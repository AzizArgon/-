# pcmarket.khudoberdi.uz over HTTPS for Cloudflare "Full (strict)": Cloudflare reaches the origin on :2053
# (an Origin Rule for this hostname only). Certificate - Let's Encrypt, renewed by certbot.
server {
    listen 2053 ssl;
    listen [::]:2053 ssl;
    server_name pcmarket.khudoberdi.uz;
    ssl_certificate     /etc/letsencrypt/live/pcmarket/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcmarket/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/pcmarket-app.conf;
}
