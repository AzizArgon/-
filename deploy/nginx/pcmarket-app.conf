# Shared part of both pcmarket server blocks (installed to /etc/nginx/snippets/pcmarket-app.conf).
root /var/www/pcmarket;
index index.html;
charset utf-8;
client_max_body_size 20m;

# The visitor's real IP comes from Cloudflare (https://www.cloudflare.com/ips/).
# Only trusted from Cloudflare addresses, so a direct request cannot fake it.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Demo site: keep it out of search engines
add_header X-Robots-Tag "noindex, nofollow" always;

access_log /var/log/nginx/pcmarket.log;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type "text/plain";
}

location /api/ {
    proxy_pass http://127.0.0.1:8020;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}

# Built files have a hash in the name, so they can be cached for long
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# index.html is never cached, so a new version shows right after deploy
location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location / {
    try_files $uri /index.html;
}
