# pcmarket.khudoberdi.uz over plain HTTP: Cloudflare reaches the origin on :80 while the zone is in Flexible mode,
# and Let's Encrypt checks the domain here. Port 443 belongs to another service on this server - not used.
server {
    listen 80;
    listen [::]:80;
    server_name pcmarket.khudoberdi.uz;
    include /etc/nginx/snippets/pcmarket-app.conf;
}
