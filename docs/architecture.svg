<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="790" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="30" y="20" width="360" height="46" rx="8" fill="#e8eef9" stroke="#94a3b8"/>
<text x="210.0" y="48.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Файл Excel / CSV / PDF  или  пост из Telegram</text>
<text x="414" y="48.0" font-size="13.5" fill="#334155">продавец загружает прайс или вставляет текст</text>
<rect x="30" y="84" width="360" height="46" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="210.0" y="112.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">markitdown / pdfplumber</text>
<text x="414" y="112.0" font-size="13.5" fill="#334155">любой файл → таблица в тексте (Markdown)</text>
<line x1="210.0" y1="66" x2="210.0" y2="81" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="148" width="360" height="46" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="210.0" y="176.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Очистка (код)</text>
<text x="414" y="176.0" font-size="13.5" fill="#334155">цена, валюта, артикул, наличие, разделы; заметки магазина</text>
<line x1="210.0" y1="130" x2="210.0" y2="145" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="212" width="360" height="46" rx="8" fill="#e7f6ec" stroke="#94a3b8"/>
<text x="210.0" y="240.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Кэш разбора</text>
<text x="414" y="240.0" font-size="13.5" fill="#334155">строка уже встречалась → ответ сразу, без ИИ</text>
<line x1="210.0" y1="194" x2="210.0" y2="209" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="276" width="360" height="46" rx="8" fill="#e7f6ec" stroke="#94a3b8"/>
<text x="210.0" y="304.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Правила</text>
<text x="414" y="304.0" font-size="13.5" fill="#334155">аккуратные строки: процессоры, память, SSD, видеокарты…</text>
<line x1="210.0" y1="258" x2="210.0" y2="273" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="340" width="360" height="46" rx="8" fill="#fdf1e3" stroke="#94a3b8"/>
<text x="210.0" y="368.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">ИИ: Gemini (запасной — Groq)</text>
<text x="414" y="368.0" font-size="13.5" fill="#334155">только то, что не разобрали кэш и правила</text>
<line x1="210.0" y1="322" x2="210.0" y2="337" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="404" width="360" height="46" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="210.0" y="432.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Нормализатор и словарь характеристик</text>
<text x="414" y="432.0" font-size="13.5" fill="#334155">«16гб» = «16 GB» = 16 ГБ; ключи для каждой категории</text>
<line x1="210.0" y1="386" x2="210.0" y2="401" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="468" width="360" height="46" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="210.0" y="496.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Проверка правдоподобия</text>
<text x="414" y="496.0" font-size="13.5" fill="#334155">характеристика есть в строке продавца? значение в разумных пределах?</text>
<line x1="210.0" y1="450" x2="210.0" y2="465" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="532" width="360" height="46" rx="8" fill="#fbe9e9" stroke="#94a3b8"/>
<text x="210.0" y="560.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Anti-Fraud</text>
<text x="414" y="560.0" font-size="13.5" fill="#334155">сначала правила, ИИ — вторым слоем (уровень «к сведению»)</text>
<line x1="210.0" y1="514" x2="210.0" y2="529" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="596" width="360" height="46" rx="8" fill="#e8eef9" stroke="#94a3b8"/>
<text x="210.0" y="624.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Предпросмотр</text>
<text x="414" y="624.0" font-size="13.5" fill="#334155">продавец проверяет, правит и публикует</text>
<line x1="210.0" y1="578" x2="210.0" y2="593" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="660" width="360" height="46" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="210.0" y="688.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">База данных (SQLite)</text>
<text x="414" y="688.0" font-size="13.5" fill="#334155">эталонные карточки, предложения, история цен, флаги</text>
<line x1="210.0" y1="642" x2="210.0" y2="657" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="724" width="360" height="46" rx="8" fill="#e8eef9" stroke="#94a3b8"/>
<text x="210.0" y="752.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Каталог  ·  Мониторинг цен</text>
<text x="414" y="752.0" font-size="13.5" fill="#334155">покупатель сравнивает магазины; медиана рынка, индексы</text>
<line x1="210.0" y1="706" x2="210.0" y2="721" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M22,212 h-10 v174 h10" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<text x="8" y="299.0" font-size="12" fill="#16a34a" text-anchor="middle" transform="rotate(-90 8 299.0)">разбор строки</text>
</svg>